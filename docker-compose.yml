name: interai

services:
  postgres:
    image: postgres:16.9-alpine@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DBNAME:-ai_interviewer}
      POSTGRES_USER: ${PG_USER:-interai}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-interai-local-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-interai} -d ${PG_DBNAME:-ai_interviewer}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    networks: [app]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    command: ["upgrade", "head"]
    env_file: [key.env]
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: ${PG_DBNAME:-ai_interviewer}
      PG_USER: ${PG_USER:-interai}
      PG_PASSWORD: ${PG_PASSWORD:-interai-local-change-me}
      REDIS_HOST: redis
      ENVIRONMENT: ${INTER_ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: interai-app:2026-07-v1
    restart: unless-stopped
    env_file: [key.env]
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: ${PG_DBNAME:-ai_interviewer}
      PG_USER: ${PG_USER:-interai}
      PG_PASSWORD: ${PG_PASSWORD:-interai-local-change-me}
      REDIS_HOST: redis
      PISTON_API_URL: ${PISTON_API_URL:?Set PISTON_API_URL to the private dedicated gVisor controller}
      ENVIRONMENT: ${INTER_ENVIRONMENT:-production}
      RAW_VIDEO_RETENTION_HOURS: "0"
      AUDIO_RETENTION_DAYS: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [app]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 4s
      retries: 12
    security_opt: ["no-new-privileges:true"]

  worker:
    image: interai-app:2026-07-v1
    command: ["python", "worker.py"]
    restart: unless-stopped
    env_file: [key.env]
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: ${PG_DBNAME:-ai_interviewer}
      PG_USER: ${PG_USER:-interai}
      PG_PASSWORD: ${PG_PASSWORD:-interai-local-change-me}
      REDIS_HOST: redis
      PISTON_API_URL: ${PISTON_API_URL:?Set PISTON_API_URL to the private dedicated gVisor controller}
      ENVIRONMENT: ${INTER_ENVIRONMENT:-production}
      WORKER_TYPE: combined
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [app]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    security_opt: ["no-new-privileges:true"]

  proxy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    networks: [app]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    security_opt: ["no-new-privileges:true"]

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: interai-backup:2026-07-v1
    restart: unless-stopped
    env_file: [key.env]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PG_DBNAME:-ai_interviewer}
      PGUSER: ${PG_USER:-interai}
      PGPASSWORD: ${PG_PASSWORD:-interai-local-change-me}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set a base64 or hex 32-byte backup key}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    command: ["loop", "--directory", "/backups"]
    volumes:
      - postgres_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "scripts/backup_database.py", "verify-latest", "--directory", "/backups", "--maximum-age-hours", "26"]
      interval: 1h
      timeout: 10s
      retries: 2

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
  prometheus_data:
  caddy_data:
  caddy_config:

networks:
  app:
    driver: bridge
