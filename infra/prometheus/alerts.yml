groups:
  - name: interai-critical
    rules:
      - alert: InterAIAPIErrorRateHigh
        expr: sum(rate(interai_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(interai_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "InterAI API 5xx rate exceeds 5%"}
      - alert: InterAIAPILatencyHigh
        expr: histogram_quantile(0.95, sum by (le, route) (rate(interai_http_request_duration_seconds_bucket[10m]))) > 2
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "InterAI API p95 latency exceeds two seconds"}
      - alert: InterAIOpenAIFailures
        expr: sum(rate(interai_ai_events_total{success="false"}[10m])) > 0.1
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "OpenAI pipeline failures are elevated"}
      - alert: InterAIDependencyUnavailable
        expr: interai_dependency_healthy == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "A required InterAI dependency is unhealthy"}
      - alert: InterAIWorkerHeartbeatMissing
        expr: interai_worker_heartbeat_age_seconds > 45
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "A durable worker heartbeat is stale"}
      - alert: InterAIQueueAgeHigh
        expr: interai_job_queue_oldest_age_seconds > 120
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "A durable job queue is falling behind"}
      - alert: InterAIStuckJobs
        expr: interai_stuck_jobs > 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Durable work exceeded its queue or lease policy"}
      - alert: InterAIBackupMissingOrStale
        expr: up{job="interai-backup"} == 0 or interai_backup_files < 1 or interai_backup_latest_age_seconds > 93600
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Encrypted database backups are missing, stale, or not observable"}
      - alert: InterAINoTrafficMetrics
        expr: absent(interai_http_requests_total)
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "InterAI metrics target is missing"}
