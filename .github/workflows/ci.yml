name: local-desktop-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/source_guard.py
      - run: python scripts/secret_scan.py
      - run: python scripts/personal_data_scan.py
      - run: python scripts/sqlite_query_audit.py --strict
      - run: python scripts/release_checks.py
      - name: Verify DCO sign-offs
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/dco_check.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

  backend:
    needs: source-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - run: python -m compileall -q .
      - run: python scripts/license_policy.py
      - run: python scripts/lock_license_inventory.py --lockfile requirements-ocr.lock.txt --inventory requirements-ocr.licenses.json
      - run: python -m pip_audit -r requirements.lock.txt --strict
      - run: python -m pip_audit -r requirements-ocr.lock.txt --no-deps --strict
        if: matrix.python-version == '3.12'

  renderer:
    needs: source-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --prefix Frontend --ignore-scripts
      - run: npm run typecheck --prefix Frontend
      - run: npm run build --prefix Frontend
      - run: npm audit --prefix Frontend --audit-level=high

  desktop-metadata:
    needs: source-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix desktop --ignore-scripts
      - run: node --check desktop/src/main.cjs
      - run: node --check desktop/src/preload.cjs
      - run: npm audit --audit-level=high
      - run: npm audit --prefix desktop --audit-level=high

  release-inventory:
    needs: [backend, renderer, desktop-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - run: python -m pip install --disable-pip-version-check cyclonedx-bom==7.3.1
      - run: npm ci --ignore-scripts
      - run: mkdir -p release-inventory
      - run: cyclonedx-py requirements requirements.lock.txt --output-reproducible --output-file release-inventory/sbom-python.json
      - run: cyclonedx-py requirements requirements-ocr.lock.txt --output-reproducible --output-file release-inventory/sbom-python-ocr.json
      - run: npx --no-install cyclonedx-npm --package-lock-only --output-reproducible --output-file release-inventory/sbom-root-npm.json package.json
      - run: npx --no-install cyclonedx-npm --package-lock-only --output-reproducible --output-file release-inventory/sbom-renderer-npm.json Frontend/package.json
      - run: npx --no-install cyclonedx-npm --package-lock-only --output-reproducible --output-file release-inventory/sbom-desktop-npm.json desktop/package.json
      - run: python scripts/license_policy.py --output release-inventory/license-inventory.json
      - run: sha256sum release-inventory/*.json > release-inventory/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-alpha-inventory
          path: release-inventory/
          if-no-files-found: error
