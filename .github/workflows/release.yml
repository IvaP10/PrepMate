name: macos-binary-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: python -m pip install --disable-pip-version-check -r requirements.lock.txt
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1 cyclonedx-bom==7.3.1
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix Frontend --ignore-scripts
      - run: npm ci --prefix desktop --ignore-scripts
      - run: python scripts/source_guard.py
      - run: python scripts/secret_scan.py
      - run: python scripts/personal_data_scan.py
      - run: python scripts/sqlite_query_audit.py --strict
      - run: python scripts/release_checks.py --distribution --tag "${{ github.ref_name }}"
        if: startsWith(github.ref, 'refs/tags/')
      - run: python scripts/release_checks.py
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
      - run: python -m compileall -q .
      - run: python scripts/license_policy.py
      - run: python scripts/lock_license_inventory.py --lockfile requirements-ocr.lock.txt --inventory requirements-ocr.licenses.json
      - run: python -m pip_audit -r requirements.lock.txt --strict
      - run: python -m pip_audit -r requirements-ocr.lock.txt --no-deps --strict
      - run: npm run typecheck --prefix Frontend
      - run: npm run build --prefix Frontend
      - run: npm audit --audit-level=high
      - run: npm audit --prefix Frontend --audit-level=high
      - run: npm audit --prefix desktop --audit-level=high
      - run: mkdir -p release-inventory
      - run: cyclonedx-py requirements requirements.lock.txt --output-reproducible --output-file release-inventory/sbom-python.json
      - run: cyclonedx-py requirements requirements-ocr.lock.txt --output-reproducible --output-file release-inventory/sbom-python-ocr.json
      - run: npx --no-install cyclonedx-npm --package-lock-only --output-reproducible --output-file release-inventory/sbom-root-npm.json package.json
      - run: npx --no-install cyclonedx-npm --package-lock-only --output-reproducible --output-file release-inventory/sbom-renderer-npm.json Frontend/package.json
      - run: npx --no-install cyclonedx-npm --package-lock-only --output-reproducible --output-file release-inventory/sbom-desktop-npm.json desktop/package.json
      - run: python scripts/license_policy.py --output release-inventory/license-inventory.json
      - run: sha256sum release-inventory/*.json > release-inventory/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-release-inventory
          path: release-inventory/
          if-no-files-found: error

  macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      PREPMATE_MAC_ARCH: ${{ matrix.arch }}
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            desktop/package-lock.json
      - run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - run: npm ci --prefix Frontend --ignore-scripts
      - run: npm ci --prefix desktop --ignore-scripts
      - run: python scripts/release_checks.py --signing macos
      - run: npm run package:mac
      - name: Verify signed and notarized application
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find desktop/release -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          python scripts/verify_desktop_bundle.py --artifact "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          dmg_path="$(find desktop/release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          hdiutil verify "$dmg_path"
          dmg_mount="$(mktemp -d)"
          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$dmg_mount"
          dmg_app="$(find "$dmg_mount" -type d -name '*.app' -print -quit)"
          test -n "$dmg_app"
          codesign --verify --deep --strict --verbose=2 "$dmg_app"
          xcrun stapler validate "$dmg_app"
          spctl --assess --type execute --verbose=4 "$dmg_app"
          hdiutil detach "$dmg_mount"
          rmdir "$dmg_mount"
          zip_path="$(find desktop/release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$zip_path"
          zip_extract="$(mktemp -d)"
          ditto -x -k "$zip_path" "$zip_extract"
          zip_app="$(find "$zip_extract" -type d -name '*.app' -print -quit)"
          test -n "$zip_app"
          codesign --verify --deep --strict --verbose=2 "$zip_app"
          xcrun stapler validate "$zip_app"
          spctl --assess --type execute --verbose=4 "$zip_app"
          rm -rf "$zip_extract"
      - name: Collect public release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find desktop/release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" = "1"
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l | tr -d ' ')" = "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepmate-macos-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, macos]
    runs-on: ubuntu-24.04
    environment: production-release
    timeout-minutes: 30
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binary-release-inventory
          path: release-inventory
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: prepmate-macos-*
          path: release-assets
          merge-multiple: true
      - name: Assemble and verify public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp release-inventory/sbom-*.json release-assets/
          cp release-inventory/license-inventory.json release-assets/
          cp LICENSE NOTICE PRIVACY.md THIRD_PARTY_NOTICES.md release-assets/
          python scripts/build_release_notes.py \
            --version "${GITHUB_REF_NAME#v}" \
            --output release-assets/RELEASE_NOTES.md
          python scripts/release_checks.py --distribution --tag "$GITHUB_REF_NAME"
          python scripts/hash_release.py release-assets --output release-assets/SHA256SUMS.txt
          storage_url="$(python -c 'import json; print(json.load(open("PUBLICATION_METADATA.json"))["release_storage_url"])')"
          website_url="$(python -c 'import json; print(json.load(open("PUBLICATION_METADATA.json"))["website_url"])')"
          python scripts/build_download_manifest.py \
            --assets release-assets \
            --output release-assets/latest.json \
            --version "${GITHUB_REF_NAME#v}" \
            --base-url "${storage_url%/}/releases/${GITHUB_REF_NAME#v}" \
            --website-url "$website_url" \
            --release-notes-url "${storage_url%/}/releases/${GITHUB_REF_NAME#v}/RELEASE_NOTES.md"
      - name: Upload immutable versioned release
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R2_ENDPOINT"
          test -n "$R2_BUCKET"
          version="${GITHUB_REF_NAME#v}"
          aws --version
          for asset in release-assets/*; do
            asset_name="$(basename "$asset")"
            if aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key "releases/${version}/${asset_name}" \
              --endpoint-url "$R2_ENDPOINT" \
              >/dev/null 2>&1; then
              echo "Immutable release object already exists: releases/${version}/${asset_name}" >&2
              exit 1
            fi
          done
          aws s3 cp release-assets/ "s3://${R2_BUCKET}/releases/${version}/" \
            --recursive --exclude 'latest.json' --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors
          aws s3 cp release-assets/latest.json "s3://${R2_BUCKET}/latest.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json \
            --cache-control 'no-cache, max-age=0' --only-show-errors
