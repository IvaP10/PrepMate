name: Bug report
description: Report a reproducible PrepMate problem using synthetic data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, resumes, transcripts, databases, or security vulnerabilities. Report vulnerabilities through the private security route in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: PrepMate version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS arm64, macOS Intel, Authorized source checkout]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic data and include expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Include non-sensitive errors only; redact local paths and provider content.
