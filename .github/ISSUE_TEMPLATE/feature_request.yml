name: Feature request
description: Suggest a local-first product improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Local-first boundary
      options:
        - label: This can work without PrepMate accounts, subscriptions, or a hosted database.
          required: true
